<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Dash — A Turkey's Great Escape</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2b1a0e;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #wrap { text-align: center; }
  canvas {
    width: min(96vw, 960px);
    height: auto;
    image-rendering: auto;
    border: 4px solid #7a2e08;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    background: #f7a94b;
    cursor: pointer;
  }
  p {
    color: #ffe9b0;
    font-size: 13px;
    margin: 10px 0 0;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <p>GOBBLE DASH — ↑ / Space / click to jump &middot; ↓ to slide &middot; P pause &middot; M mute</p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
